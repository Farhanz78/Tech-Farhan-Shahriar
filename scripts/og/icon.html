<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!--
  Source for the favicon / app icon. Render with scripts/og/render.sh.

  Design constraint: this is read at 16x16 in a browser tab. Anything with more
  than one idea in it turns to mush at that size, so the wireframe sphere from
  the hero is out. What survives is the site's own wordmark reduced to its two
  strongest parts: the F, and the lime full stop after "Farhan." — which is
  already the brand mark in the header.

  Rendered at 512 and downsampled, so the ICO's 16/32/48 entries all come from
  one clean master rather than three separate hand-drawn sizes.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;overflow:hidden}
.icon{width:512px;height:512px;position:relative;
  background:radial-gradient(circle at 32% 26%,#12211a 0%,#080d0b 62%,#05090b 100%)}
/* A soft lime bloom, so the mark does not read as flat black in a dark tab bar. */
.bloom{position:absolute;left:-60px;bottom:-90px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(190,242,100,.22) 0%,transparent 66%)}
.mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-bottom:14px}
.f{font-family:'Inter',sans-serif;font-weight:900;font-size:340px;line-height:1;
  color:#fff;letter-spacing:-.06em}
.dot{width:62px;height:62px;border-radius:50%;background:#bef264;
  margin-left:12px;margin-top:150px;box-shadow:0 0 44px rgba(190,242,100,.85)}
/* Faint inner edge: stops the icon dissolving into a dark browser chrome. */
.ring{position:absolute;inset:0;border-radius:96px;
  box-shadow:inset 0 0 0 3px rgba(190,242,100,.16)}
</style></head>
<body><div class="icon">
  <div class="bloom"></div>
  <div class="mark"><span class="f">F</span><span class="dot"></span></div>
  <div class="ring"></div>
</div></body></html>
